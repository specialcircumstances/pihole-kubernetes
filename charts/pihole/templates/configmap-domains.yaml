{{ if .Values.domains }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "pihole.fullname" . }}-domains
  labels:
    app: {{ template "pihole.name" . }}
    chart: {{ template "pihole.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  domains.sh: |
    #!/usr/bin/env bash
    # shellcheck disable=SC1090

    # List of pihole commands to configure / reconfigure permit and deny lists
  {{- if eq .Values.domains.alwaysNuke true }}
    # Temp need to do this to make pihole cli work
    sed -i 's/^readonly //' /opt/pihole/list.sh
    # pihole allow --nuke --noreload 
    # pihole deny --nuke --noreload 
    # pihole --allow-wild --nuke --noreload 
    # pihole --wild --nuke --noreload 
    # pihole --allow-regex --nuke --noreload 
    # pihole --regex --nuke --noreload 
    pihole reloaddns
    sleep 5
  {{- end }}
  {{- if .Values.domains.permit }}
    {{- range .Values.domains.permit }}
    pihole allow {{ . }} --comment "Added by pihole Helm chart"
    {{- end }}
  {{- end }}
  {{- if .Values.domains.deny }}
    {{- range .Values.domains.deny }}
    pihole deny {{ . }} --comment "Added by pihole Helm chart"
    {{- end }}
  {{- end }}
  {{- if .Values.domains.permitWildcard }}
    {{- range .Values.domains.permitWildcard }}
    pihole --allow-wild {{ . }} --comment "Added by pihole Helm chart"
    {{- end }}
  {{- end }}
  {{- if .Values.domains.denyWildcard }}
    {{- range .Values.domains.denyWildcard }}
    pihole --wild {{ . }} --comment "Added by pihole Helm chart"
    {{- end }}
  {{- end }}
  {{- if .Values.domains.permitRegex }}
    {{- range .Values.domains.permitRegex }}
    pihole --allow-regex '{{ . }}' --comment "Added by pihole Helm chart"
    {{- end }}
  {{- end }}
  {{- if .Values.domains.denyRegex }}
    {{- range .Values.domains.denyRegex }}
    pihole --regex '{{ . }}' --comment "Added by pihole Helm chart"
    {{- end }}
  {{- end }}
    pihole reloaddns
    # End of list
{{ end }}
